services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: financehot-postgres
    environment:
      POSTGRES_USER: financehot
      POSTGRES_PASSWORD: financehot
      POSTGRES_DB: financehot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financehot -d financehot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - financehot

  redis:
    image: redis:7-alpine
    container_name: financehot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - financehot

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: financehot-web
    environment:
      DATABASE_URL: postgresql://financehot:financehot@postgres:5432/financehot
      REDIS_URL: redis://redis:6379
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - financehot

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: financehot-worker
    environment:
      DATABASE_URL: postgresql://financehot:financehot@postgres:5432/financehot
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - financehot

volumes:
  postgres_data:
  redis_data:

networks:
  financehot:
    driver: bridge
